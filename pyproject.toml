[project]
name = "techmatch"
version = "0.1.0"
description = "Tech-only resume to job matcher"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # resume parsing
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    # sourcing
    "httpx>=0.27",
    "selectolax>=0.3",          # fast HTML parsing for scrapers
    "tenacity>=8.3",            # retries / rate limiting
    # matching
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",        # TF-IDF
    "faiss-cpu>=1.8",
    # background jobs
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",              # mock httpx in tests
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
